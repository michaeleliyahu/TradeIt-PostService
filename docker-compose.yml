# Post service compose file
# Requires shared infrastructure: run 'docker-compose up -d' from TradeIT root first

services:
  post-service:
    build: .
    env_file:
      - .env
    ports:
      - "8002:8000"  # Different port than identity service
    depends_on:
      - post-db
    volumes:
      - .:/app
    networks:
      - tradeit-network
      - default
    restart: on-failure

  post-db:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5434:5432"  # Different port than identity service DB
    volumes:
      - post_db_data:/var/lib/postgresql/data

networks:
  tradeit-network:
    external: true

volumes:
  post_db_data: